<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Configuration</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #555;
        }
        
        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.2rem;
            transition: border-color 0.3s;
        }
        
        /* 下拉框特定样式 */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 1em;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
            border-color: #4CAF50;
            outline: none;
        }
        
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f0f0f0;
            font-size: 1.1rem;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
                margin-bottom: 20px;
            }
            
            input[type="text"],
            input[type="password"],
            select {
                padding: 12px;
                font-size: 1rem;
            }
            
            select {
                background-position: right 12px center;
            }
            
            button {
                padding: 15px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WiFi Setup</h1>
        <form id="wifiForm">
            <div class="form-group">
                <label for="ssid">WiFi SSID:</label>
                <select id="ssid" name="ssid" required>
                    <!-- 初始为空，通过JS动态填充 -->
                </select>
            </div>
            
            <div class="form-group">
                <label for="password">WiFi Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter WiFi password">
            </div>
            
            <button type="submit">Submit Configuration</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ssidSelect = document.getElementById('ssid');
            
            // 先添加加载状态选项
            const loadingOption = document.createElement('option');
            loadingOption.value = '';
            loadingOption.textContent = 'Scanning for networks...';
            loadingOption.disabled = true;
            loadingOption.selected = true;
            ssidSelect.appendChild(loadingOption);

            fetch('/scan')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(networks => {
                    // 清空下拉框
                    ssidSelect.innerHTML = '';
                    
                    if (networks.length > 0) {
                        // 有网络时，默认选中第一个
                        networks.forEach((network, index) => {
                            const option = document.createElement('option');
                            option.value = network.ssid;
                            option.textContent = network.ssid;
                            if (network.rssi) {
                                option.textContent += ` (${Math.abs(network.rssi)}dBm)`;
                            }
                            ssidSelect.appendChild(option);
                            
                            // 默认选中第一个
                            if (index === 0) {
                                option.selected = true;
                            }
                        });
                    } else {
                        // 无网络时显示提示
                        const noNetworkOption = document.createElement('option');
                        noNetworkOption.value = '';
                        noNetworkOption.textContent = 'No networks found';
                        noNetworkOption.disabled = true;
                        noNetworkOption.selected = true;
                        ssidSelect.appendChild(noNetworkOption);
                        
                        // 添加手动输入选项
                        const manualOption = document.createElement('option');
                        manualOption.value = "manual";
                        manualOption.textContent = "Manually enter SSID";
                        ssidSelect.appendChild(manualOption);
                    }
                })
                .catch(error => {
                    console.error('Error fetching WiFi networks:', error);
                    ssidSelect.innerHTML = '';
                    
                    // 错误时显示提示并允许手动输入
                    const errorOption = document.createElement('option');
                    errorOption.value = '';
                    errorOption.textContent = 'Failed to scan networks';
                    errorOption.disabled = true;
                    errorOption.selected = true;
                    ssidSelect.appendChild(errorOption);
                    
                    const manualOption = document.createElement('option');
                    manualOption.value = "manual";
                    manualOption.textContent = "Manually enter SSID";
                    ssidSelect.appendChild(manualOption);
                });
        });

        // 表单提交处理（保持不变）
        document.getElementById('wifiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const ssid = document.getElementById('ssid').value;
            const password = document.getElementById('password').value;
            
            if (ssid === "manual") {
                const manualSsid = prompt("Please enter the WiFi SSID:");
                if (!manualSsid) return;
                
                fetch('/configure', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ ssid: manualSsid, password }),
                })
                .then(handleResponse)
                .catch(handleError);
            } else {
                fetch('/configure', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ ssid, password }),
                })
                .then(handleResponse)
                .catch(handleError);
            }
            
            function handleResponse(response) {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.text();
            }
            
            function handleResponse(data) {
                alert('Configuration saved successfully!');
                document.getElementById('wifiForm').style.display = 'none';
                document.querySelector('.container').innerHTML += '<h3 style="text-align:center;margin-top:20px;">Configuration complete! You may close this page.</h3>';
                setTimeout(() => { window.location.href = 'about:blank'; }, 3000);
            }
            
            function handleError(error) {
                console.error('Error:', error);
                alert('Failed to save configuration: ' + error.message);
            }
        });
    </script>
</body>
</html>
