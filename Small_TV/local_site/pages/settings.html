<head>
    <!-- 页面基础设置 -->
    <title>Smart Weather Clock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        /* 全局样式设置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 主体样式 */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f5f5f5;
            padding: 20px;
            color: #333;
        }

        /* 容器样式 */
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto 30px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        /* 标题样式 */
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            color: #333;
        }

        /* 二级标题样式 */
        h2 {
            margin: 25px 0 15px;
            font-size: 1.5rem;
            color: #444;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 8px;
        }

        /* 表单组样式 */
        .form-group {
            margin-bottom: 20px;
        }

        /* 标签样式 */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* 输入框和选择框通用样式 */
        input[type="text"],
        input[type="password"],
        input[type="range"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }

        /* 选择框自定义下拉箭头 */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 1em;
        }

        /* 输入框焦点状态 */
        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
            border-color: #4CAF50;
            outline: none;
        }

        /* 滑动条样式 */

        input[type="range"] {
            -webkit-appearance: none;
            height: 8px;
            background: #ddd;
            border-radius: 5px;
            padding: 0;
        }

        /* 滑动条滑块样式 */

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #4CAF50;
            border-radius: 50%;
            cursor: pointer;
        }

        /* 开关控件样式 */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 22px;
            vertical-align: middle;
            margin-left: 8px;
        }

        /* 开关隐藏原生输入框 */
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* 开关滑块样式 */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 22px;
        }

        /* 开关滑块按钮 */
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        /* 开关激活状态 */
        input:checked + .slider {
            background-color: #4CAF50;
        }

        /* 开关激活时滑块位置 */
        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* 按钮样式 */
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            margin: 5px 0;
            transition: background-color 0.3s;
            width: 100%;
        }

        /* 按钮悬停状态 */
        button:hover {
            background-color: #45a049;
        }

        /* 颜色选择器容器 */
        .color-pickers {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        /* 颜色选择器样式 */
        .color-pickers input[type="color"] {
            width: 30px;
            height: 30px;
            padding: 0;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        /* 段落样式 */
        p {
            margin-bottom: 15px;
            line-height: 1.5;
        }

        /* 移动端响应式设计 */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.3rem;
            }

            input, select, button {
                padding: 10px;
                font-size: 1rem;
            }
        }
    </style>
</head>

    <script>
/** Format a network option while preserving the API's signed RSSI in dBm. */
function formatWifiNetworkLabel(network) {
    // FIXED_FACTORY: Math.abs erased the sign of received signal power.
    const suffix = Number.isFinite(network.rssi) ? ` (${network.rssi}dBm)` : '';
    return network.ssid + suffix;
}

/** Distinguish the manual-entry option from a real access point's SSID. */
function isManualWifiSelection(select) {
    // FIXED_FACTORY: the literal SSID "manual" is a valid discovered network.
    return select.selectedOptions[0]?.dataset.manualEntry === 'true';
}

        /**
         * 刷新WiFi网络列表
         * 对应控件：Refresh WiFi List按钮
         */
        // 页面加载时自动刷新
        function refreshList() {
            if (!document.getElementById('wifi_list')) return;
            // 发送请求获取WiFi列表
            fetch('/scan')
                .then(response => response.json())
                .then(networks => {
                    const select = document.getElementById('wifi_list');
                    if (!select) return;
                    // 清空现有选项
                    select.innerHTML = '<option value="">Select WiFi Network</option>';
                    // 添加扫描到的网络
                    networks.forEach(network => {
                        const option = document.createElement('option');
                        option.value = network.ssid;
                        // 显示SSID和信号强度
                        option.textContent = formatWifiNetworkLabel(network);
                        select.appendChild(option);
                    });
                });
        }

        /*****************************************************************
         * 开关控件
         * 对应控件：开关功能选择
         *****************************************************************/
				function initSwitches() {
                    // Read actual flags before permitting a combined settings write.
                    const controls = ['temp-unit-switch', 'hour-format-switch', 'mile-display-switch'];
                    const status = document.getElementById('switch-status');
                    controls.forEach(id => document.getElementById(id).disabled = true);
                    status.textContent = 'Loading clock settings…';
                    fetch('/getsettings')
                        .then(response => {
                            if (!response.ok) throw new Error('Cannot load clock settings');
                            return response.json();
                        })
                        .then(data => {
                            if (!data || !['tempUnit', 'hourFormat', 'mileDisplay', 'timeSync'].every(
                                key => data[key] === 0 || data[key] === 1)) {
                                throw new Error('Invalid clock settings');
                            }
                            document.getElementById('temp-unit-switch').checked = data.tempUnit === 1;
                            document.getElementById('hour-format-switch').checked = data.hourFormat === 1;
                            document.getElementById('mile-display-switch').checked = data.mileDisplay === 1;
                            document.getElementById('time-sync-switch').checked = data.timeSync === 1;
                            controls.forEach(id => document.getElementById(id).disabled = false);
                            status.textContent = '';
                        })
                        .catch(error => {
                            console.error('Error loading clock settings:', error);
                            status.textContent = 'Clock settings could not be loaded. Reload to retry.';
                        });
                }

                // 发送开关状态到ESP8266
				function sendSwitchStates() {
				    const states = {
				        tempUnit: document.getElementById('temp-unit-switch').checked ? 1 : 0,
				        hourFormat: document.getElementById('hour-format-switch').checked ? 1 : 0,
				        mileDisplay: document.getElementById('mile-display-switch').checked ? 1 : 0,
				        timeSync: document.getElementById('time-sync-switch').checked ? 1 : 0,
				        //nightmode: document.getElementById('Nightmode').checked ? 1 : 0
				    };

				    fetch('/settings', {
				        method: 'POST',
				        headers: {'Content-Type': 'application/json'},
				        body: JSON.stringify(states)
				    }).catch(error => console.error('Error:', error));
				}

				// 初始化
				document.addEventListener('DOMContentLoaded', function() {
				    initSwitches();
				    document.querySelectorAll('.switch input').forEach(switchEl => {
				        switchEl.addEventListener('change', sendSwitchStates);
				    });
				});

        /*****************************************************************

		document.getElementById('cityForm').addEventListener('submit', function(e) {

		    // 使用POST请求，通过请求体发送数据
		    fetch('/updateCity', {

		        headers: {
		            'Content-Type': 'application/json'  // 使用JSON格式
		        },
		        body: JSON.stringify({ city: city })  // 自动处理编码
		    })
		    .then(response => {
		        if (response.ok) {
		            alert('City updated successfully');
		        } else {

		        }
		    })
		    .catch(error => {

        /*****************************************************************

        const brightnessSlider = document.getElementById('ledBrightness');
        // 页面加载时获取初始亮度值

        /*****************************************************************
         * 颜色选择控件
         * 对应控件：设置时分秒的颜色
         *****************************************************************/
        // 初始化颜色选择器
        document.addEventListener('DOMContentLoaded', function() {
            // 获取初始颜色值
            fetch('/get_clock_colors')
                .then(response => response.json())
	            .then(data => {
                    document.getElementById('colorPicker0').value = data.color0 || '#ff0000';
                    document.getElementById('colorPicker1').value = data.color1 || '#ffff00';
                    document.getElementById('colorPicker2').value = data.color2 || '#ffffff';

                    console.error('Error fetching colors:', error);
                    // 使用默认值
                    document.getElementById('colorPicker0').value = '#ff0000';
                    document.getElementById('colorPicker1').value = '#ffff00';
                    document.getElementById('colorPicker2').value = '#ffffff';
                });

            // 为每个颜色选择器添加事件监听
            document.querySelectorAll('.color-pickers input[type="color"]').forEach((picker, index) => {
                picker.addEventListener('change', function() {
                    updateClockColor(index, this.value);
                });
            });
        });

        // 更新时钟颜色
        function updateClockColor(index, color) {
            fetch('/set_clock_color', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    index: index,
                    color: color
                })
            })
            .then(response => {
                if (!response.ok) throw new Error('Failed to update color');
                console.log(`Color ${index} updated to: ${color}`);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to update color');
            });
        }

         * 晚间模式起始时间控件
         * 对应控件：select 选择不同起始时间

				            if (StartTimeSelect) StartTimeSelect.value = currentStartTime;

				        .catch(error => {
				            console.error('Error fetching night mode start time:', error);
				        });

        const NightbrightnessSlider = document.getElementById('NightBrightness');
        // 页面加载时获取初始亮度值
        NightbrightnessSlider && fetch('/get_night_brightness')
            .then(response => {
                if (!response.ok) throw new Error('Failed to get brightness');
                return response.json();
            })
            .then(data => {
                if (NightbrightnessSlider) NightbrightnessSlider.value = data.brightness;
            })
            .catch(error => {
                console.error('Error:', error);
                if (NightbrightnessSlider) NightbrightnessSlider.value = 50; // 默认值
            });
        // 实时发送亮度值
        NightbrightnessSlider?.addEventListener('input', function() {
            fetch('/set_night_brightness', {
                method: 'POST',

                    'Content-Type': 'application/x-www-form-urlencoded',

        document.getElementById('wifiscanForm')?.addEventListener('submit', function(e) {
            // FIXED_RECONSTRUCTION: keep the factory blank-page target after Wi-Fi restart.
            // Reloading the old AP URL fails once the device becomes a station.
            e.preventDefault();

            // 获取表单数据

            // 发送数据到ESP8266
            fetch('/wifireset', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    ssid: ssid,
                    password: password,
                })
            })
            .then(response => {
                if (response.ok) {
	                alert('Configuration saved successfully!');
//	                document.getElementById('wifiscanForm').style.display = 'none';
//	                document.querySelector('.container').innerHTML += '<h3 style="text-align:center;margin-top:20px;">Configuration complete! You may close this page.</h3>';
	                setTimeout(() => { window.location.href = 'about:blank'; }, 3000);
                } else {
                    throw new Error('Failed to save settings');

            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to save settings');
            });
        });

        /*****************************************************************
         * 系统控制功能
         * 对应控件：System Restart按钮
         *****************************************************************/
        function restartESP() {
            if (confirm('Are you sure you want to restart the device?')) {
                fetch('/restart', { method: 'POST' })
                    .then(() => alert('Device is restarting...'));
            }
        }

        /*****************************************************************
         * 安全提交按钮功能（点击10次激活）
         * 对应控件：Advanced Settings中的点击计数器和保存按钮
         *****************************************************************/
        let clickCount = 0;
        let clickTimer;
        const counter = document.getElementById('clickCounter');

        // 计数器点击事件
        counter?.addEventListener('click', function() {
            clickCount++;
            counter.textContent = clickCount;

            // 达到10次后激活按钮
//            if (clickCount >= 10) {
//                document.getElementById('submitButton').disabled = false;
//                counter.style.color = '#4CAF50';
//            }

            // 重置计时器
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => {
                clickCount = 0;
                counter.textContent = '0';
                counter.style.color = '';
            }, 3000);
        });
        // 表单提交处理
        document.getElementById('advancedSettingsForm')?.addEventListener('submit', function(e) {
            e.preventDefault();

            // 获取表单数据
            const ntpServer = document.getElementById('ntp').value;
            const apiKey = document.getElementById('openweathermapKey').value;
            const clicks = clickCount;

            // 发送数据到ESP8266
            fetch('/advancedset', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    ntp: ntpServer,
                    openweathermapKey: apiKey,
                    clickCount: clicks
                })
            })
            .then(response => {
                if (response.ok) {
                    alert('Settings saved successfully!');
                    // 重置表单和计数器
                    clickCount = 0;
                    document.getElementById('clickCounter').textContent = '0';
//                    submitButton.disabled = true;
                } else {
                    throw new Error('Failed to save settings');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to save settings');
            });
        });
