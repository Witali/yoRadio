<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Smart Weather clock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* 全局样式重置 */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* 基础样式 */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f5f5f5;
            padding: 20px;
            color: #333;
        }

        h1 { text-align: center; margin-bottom: 30px; font-size: 2.5rem; color: #333; }
        h2 { margin: 25px 0 15px; font-size: 1.5rem; color: #444; border-bottom: 2px solid #4CAF50; padding-bottom: 8px; }

        /* 加载遮罩层样式 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px; height: 50px;
            border: 5px solid #f3f3f3; border-top: 5px solid #4CAF50;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        .loading-text { color: white; font-size: 1.2rem; font-weight: bold; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 禁用状态样式 */
        button:disabled, input:disabled { opacity: 0.6; cursor: not-allowed !important; }
        body.loading { cursor: wait; }

        /* 输入控件通用样式 */
        input[type="text"], input[type="range"], select {
            width: 100%; padding: 12px; border: 2px solid #ddd;
            border-radius: 8px; font-size: 1.1rem; margin-bottom: 15px;
        }

        /* 滑块样式 */
        input[type="range"] { -webkit-appearance: none; height: 8px; background: #ddd; border-radius: 5px; padding: 0; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #4CAF50; border-radius: 50%; cursor: pointer; }

        input[type="checkbox"] { width: 15px; height: 15px; margin-right: 4px; cursor: pointer; }
        input[type="file"] { margin: 2px 0; padding: 0px; border: 2px solid #ddd; border-radius: 3px; background: white; }

        /* 图片缩略图样式 */
        .thumbnail-container {
            display: flex; flex-direction: column; align-items: flex-start;
            gap: 4px; margin: 4px 0; padding: 8px;
            border: 1px solid #ddd; border-radius: 8px; background: white;
        }

        .thumbnail-container img { margin: 0; border: 1px solid #ccc; border-radius: 2px; object-fit: cover; }

        /* 按钮样式 */
        button {
            background-color: #4CAF50; color: white; padding: 12px 20px;
            border: none; border-radius: 8px; cursor: pointer;
            font-size: 1.1rem; font-weight: bold; margin: 5px 0;
            transition: background-color 0.3s; width: 100%;
        }
        button:hover { background-color: #45a049; }

        /* 状态显示 */
        #status { padding: 10px; margin: 10px 0; border-radius: 5px; text-align: center; font-weight: bold; min-height: 40px;}
        .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<nav aria-label="Pages" style="text-align:center;padding:10px;font:14px Arial,sans-serif;margin-bottom:12px"><a href="/settings">Clock Settings</a> &middot; <a href="/photo">Photos</a> &middot; <a href="/setup">Wi-Fi Setup</a></nav>

    <h1>Smart Weather Clock</h1>
    <div class="city-settings">
        <h2>Photo Mode</h2>

        <!-- 加载遮罩层 -->
        <div id="loading-overlay" class="loading-overlay" style="display: none;">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading...</div>
        </div>

        <!-- 播放速度设置 -->
        <div class="setting-group">
            <label for="displaytime">Play Speed: 3-60 Seconds</label>
            <input type='range' id='displaytime' name='displaytime' min='3' max='60' value='5'>
            <span id="display-time-value">5s</span>
        </div>

        <!-- 文件上传区域 -->
        <div id="file-settings">
            <!-- 接受所有图片类型 accept="image/*" -->
            <div class="thumbnail-container">
                <input type="checkbox" id="file1-switch" checked>
                <img id="thumbnail1" style="width:50px;height:50px">
                <input type="file" accept="image/*" id="imageFile1">
            </div>

            <div class="thumbnail-container">
                <input type="checkbox" id="file2-switch" checked>
                <img id="thumbnail2" style="width:50px;height:50px">
                <input type="file" accept="image/*" id="imageFile2">
            </div>

            <div class="thumbnail-container">
                <input type="checkbox" id="file3-switch" checked>
                <img id="thumbnail3" style="width:50px;height:50px">
                <input type="file" accept="image/*" id="imageFile3">
            </div>

            <div class="thumbnail-container">
                <input type="checkbox" id="file4-switch" checked>
                <img id="thumbnail4" style="width:50px;height:50px">
                <input type="file" accept="image/*" id="imageFile4">
            </div>

            <div class="thumbnail-container">
                <input type="checkbox" id="file5-switch" checked>
                <img id="thumbnail5" style="width:50px;height:50px">
                <input type="file" accept="image/*" id="imageFile5">
            </div>
        </div>

        <!-- 状态显示 -->
        <div id="status"></div>

        <!-- 返回按钮 -->
        <button id="return-btn">RETURN</button>
    </div>

    <script>
        // 全局变量
        let currentSettings = {
            display_time: 5,
            file_states: {}
        };
        let isLoading = false;

        document.addEventListener('DOMContentLoaded', function() {
            initializePage();
        });

        // 初始化页面
        async function initializePage() {
            try {
                await loadDisplayTime();
                await loadCheckboxStates();
                await refreshAllThumbnails();
                setupEventListeners();
            } catch (error) {
                console.error('Error initializing page:', error);
                showStatus('Initialization failed: ' + error.message, 'error');
            }
        }

        function updateLoadingText(message) {
            const loadingText = document.querySelector('.loading-text');
            if (loadingText && isLoading) {
                loadingText.textContent = message;
            }
        }

        // 加载显示时间
        async function loadDisplayTime() {
            try {
                const response = await fetch('/get_display_time');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                const displayTime = data.displaytime || 5;

                const slider = document.getElementById('displaytime');
                const valueDisplay = document.getElementById('display-time-value');
                if (slider) { slider.value = displayTime; currentSettings.display_time = displayTime; }
                if (valueDisplay) { valueDisplay.textContent = displayTime + 's'; }
            } catch (error) {
                console.warn('Could not load display time, utilizing defaults');
            }
        }

        // 加载复选框状态
        async function loadCheckboxStates() {
            try {
                const response = await fetch('/get_checkbox_state');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                for (let i = 1; i <= 5; i++) {
                    const checkbox = document.getElementById(`file${i}-switch`);
                    if (checkbox) {
                        const state = data[`file${i}_switch`];
                        checkbox.checked = state !== undefined ? state : true;
                    }
                }
            } catch (error) {
                console.warn('Could not load checkbox states');
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 滑块
            const displayTimeSlider = document.getElementById('displaytime');
            if (displayTimeSlider) {
                displayTimeSlider.addEventListener('input', function() {
                    document.getElementById('display-time-value').textContent = this.value + 's';
                });
                displayTimeSlider.addEventListener('change', function() {
                    updateDisplayTime(this.value);
                });
            }

            // 复选框
            document.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
                checkbox.addEventListener('change', function() {
                    updateCheckboxState(this.id, this.checked);
                });
            });

            // 文件上传 (关键修改：监听 change 事件)
            for (let i = 1; i <= 5; i++) {
                const fileInput = document.getElementById(`imageFile${i}`);
                if (fileInput) {
                    fileInput.addEventListener('change', function() {
                        handleFileUpload(this, i);
                    });
                }
            }

            // 返回按钮
            const returnButton = document.getElementById('return-btn');
            if (returnButton) {
                returnButton.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href='/';
                });
            }
        }

        // 更新时间设置
        async function updateDisplayTime(time) {
            try {
                await fetch('/set_display_time', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ display_time: parseInt(time) })
                });
            } catch (e) { console.error(e); }
        }

        // 更新复选框设置
        async function updateCheckboxState(checkboxId, checked) {
            try {
                await fetch('/set_checkbox_state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ checkbox_id: checkboxId, checked: checked })
                });
            } catch (e) { console.error(e); }
        }

        /**
         * 核心修改 1: 图片预处理函数
         * 功能：读取任意图片 -> 裁剪为 240x240 (居中覆盖) -> 转为 JPG -> 压缩至 100KB 以内
         */
        function resizeAndCropImage(file) {
            return new Promise((resolve, reject) => {
                // 1. 基本检查
                if (!file.type.match(/image.*/)) {
                    reject(new Error("File is not an image"));
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // 2. 创建 Canvas 进行尺寸调整
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        const targetSize = 240;
                        canvas.width = targetSize;
                        canvas.height = targetSize;

                        // 3. 计算居中裁剪 (Cover 模式)
                        let sourceWidth = img.width;
                        let sourceHeight = img.height;
                        let sourceX = 0;
                        let sourceY = 0;

                        const aspectRatio = sourceWidth / sourceHeight;

                        if (sourceWidth > sourceHeight) {
                            // 宽图：以高度为基准
                            sourceWidth = sourceHeight; // 截取正方形
                            sourceX = (img.width - sourceWidth) / 2; // 居中
                        } else {
                            // 长图：以宽度为基准
                            sourceHeight = sourceWidth; // 截取正方形
                            sourceY = (img.height - sourceHeight) / 2; // 居中
                        }

                        // 4. 在 Canvas 上绘制 (重采样)
                        // drawImage(img, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)
                        ctx.drawImage(img, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, targetSize, targetSize);

                        // 5. 导出为 Blob (JPG)
                        // 初始质量 0.9，240x240图片通常只有15-20KB
                        canvas.toBlob((blob) => {
                            if (!blob) {
                                reject(new Error("Canvas to Blob failed"));
                                return;
                            }

                            // 6. 再次检查大小 (安全网)
                            if (blob.size > 100 * 1024) {
                                // 如果极大概率不可能发生的情况发生了(比如全噪点图)，降低质量重试
                                canvas.toBlob((blobRetry) => {
                                    if (blobRetry.size > 100 * 1024) {
                                        reject(new Error("Image too complex to compress under 100KB"));
                                    } else {
                                        resolve(blobRetry);
                                    }
                                }, 'image/jpeg', 0.6);
                            } else {
                                resolve(blob);
                            }
                        }, 'image/jpeg', 0.9);
                    };
                    img.onerror = () => reject(new Error("Failed to load image"));
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 处理文件上传主逻辑
        async function handleFileUpload(fileInput, fileNumber) {
            const rawFile = fileInput.files[0];
            if (!rawFile) return;

            // 清空input，以便可以重复上传同一张图片
            fileInput.value = '';

            try {
                showLoading(`Processing image ${fileNumber}...`);

                // 1. 调用预处理函数
                const processedBlob = await resizeAndCropImage(rawFile);

                // 2. 将 Blob 转为 File 对象以便上传函数使用
                const processedFile = new File([processedBlob], `file${fileNumber}.jpg`, { type: 'image/jpeg' });

                console.log(`Original: $${rawFile.size}B, Processed: $${processedFile.size}B`);

                updateLoadingText(`Uploading file ${fileNumber}...`);

                // 3. 执行分块上传
                await uploadImageInChunks(processedFile, fileNumber);

                // 4. 上传成功后，直接用处理后的图片更新预览图 (无需从服务器重新下载，体验更快)
                const url = URL.createObjectURL(processedBlob);
                const thumb = document.getElementById(`thumbnail${fileNumber}`);
                if(thumb) {
                    thumb.src = url;
                    thumb.style.display = 'block';
                }

                showStatus(`File ${fileNumber} uploaded successfully`, 'success');

                // 确保开关打开
                const checkbox = document.getElementById(`file${fileNumber}-switch`);
                if (checkbox && !checkbox.checked) {
                    checkbox.checked = true;
                    updateCheckboxState(checkbox.id, true);
                }

            } catch (error) {
                console.error('Upload process error:', error);
                showStatus(`Error: ${error.message}`, 'error');
            } finally {
                hideLoading();
            }
        }

        /**
         * 核心修改 2: 优化后的分块上传
         * 增加了延时和更稳健的重试逻辑
         */
        async function uploadImageInChunks(file, fileNumber) {
            const CHUNK_SIZE = 4096; // 4KB
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

            // 1. 开始上传握手
            const startResponse = await fetch('/start_upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    file_number: fileNumber,
                    file_size: file.size,
                    total_chunks: totalChunks
                })
            });

            if (!startResponse.ok) throw new Error('Failed to start upload session');

            // 2. 循环上传块
            for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
                const start = chunkIndex * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, file.size);
                const chunk = file.slice(start, end);

                const formData = new FormData();
                formData.append('chunk', chunk);
                formData.append('file_number', fileNumber.toString());
                formData.append('chunk_index', chunkIndex.toString());
                formData.append('total_chunks', totalChunks.toString());

                let lastError;
                let success = false;

                // 重试逻辑
                for(let retry = 0; retry < 5; retry++) {
                    try {
                        const progress = Math.round(((chunkIndex) / totalChunks) * 100);
                        updateLoadingText(`Uploading... $${progress}% (File $${fileNumber})`);

                        const response = await fetch('/upload_chunk', {
                            method: 'POST',
                            body: formData
                        });

                        if (response.ok) {
                            success = true;
                            break;
                        }

                        lastError = `HTTP ${response.status}`;
                        // 失败后等待一段时间再重试 (退避策略)
                        await new Promise(r => setTimeout(r, 500 * (retry + 1)));

                    } catch(error) {
                        lastError = error.message;
                        await new Promise(r => setTimeout(r, 500 * (retry + 1)));
                    }
                }

                if (!success) {
                    throw new Error(`Chunk $${chunkIndex} failed after retries: $${lastError}`);
                }

                // **关键优化**: 每次成功上传一块后，暂停 50ms
                // 让 ESP32 有时间将数据从内存 buffer 写入 Flash 并清理栈空间
                await new Promise(resolve => setTimeout(resolve, 50));
            }

            // 3. 结束上传确认
            const finishResponse = await fetch('/finish_upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    file_number: fileNumber,
                    file_name: `file${fileNumber}.jpg`
                })
            });

            if (!finishResponse.ok) throw new Error('Finish upload command failed');
        }

        // 分块下载图片 (用于页面加载时获取预览图)
        async function downloadImageInChunks(fileNumber, fileSize) {
            const CHUNK_SIZE = 10240; // 下载时可以用大一点的块
            const totalChunks = Math.ceil(fileSize / CHUNK_SIZE);
            const chunks = [];

			console.log(`Starting download: file${fileNumber}, size: ${fileSize}, chunks: ${totalChunks}`);

            for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
                const response = await fetch(`/get_Photo_File?file=${fileNumber}&chunk=${chunkIndex}&size=${CHUNK_SIZE}`);
                if (!response.ok) throw new Error(`Download chunk ${chunkIndex} failed`);

                const chunkData = await response.arrayBuffer();
                chunks.push(new Uint8Array(chunkData));

                // 避免UI卡顿
                if(chunkIndex % 5 === 0) await new Promise(r => setTimeout(r, 10));
            }

            const totalLength = chunks.reduce((acc, chunk) => acc + chunk.length, 0);
            const result = new Uint8Array(totalLength);
            let offset = 0;
            for (const chunk of chunks) {
                result.set(chunk, offset);
                offset += chunk.length;
            }
            return result;
        }

        // 刷新单个缩略图
        async function refreshThumbnail(fileNumber) {
            try {
                const thumbnail = document.getElementById(`thumbnail${fileNumber}`);
                if (!thumbnail) return;

                // 获取图片信息
                const infoResponse = await fetch(`/get_Photo_File?file=${fileNumber}&chunk=0&size=0`);
                if (!infoResponse.ok) return; // 忽略错误，可能文件不存在

                const imageInfo = await infoResponse.json();
                if (!imageInfo.exists || imageInfo.size === 0) {
                    thumbnail.style.display = 'none';
                    return;
                }

                const imageData = await downloadImageInChunks(fileNumber, imageInfo.size);
                const blob = new Blob([imageData], { type: 'image/jpeg' });
                const url = URL.createObjectURL(blob);

                thumbnail.src = url;
                thumbnail.style.display = 'block';

            } catch (error) {
                console.log(`Thumbnail ${fileNumber} load skipped or failed`);
            }
        }

        // 刷新所有缩略图
        async function refreshAllThumbnails() {
            try {
                showLoading('Loading previews...');
                for (let i = 1; i <= 5; i++) {
                    updateLoadingText(`Loading preview ${i}/5`);
                    await refreshThumbnail(i);
                }
            } catch(e) {
                console.error(e);
            } finally {
                hideLoading();
            }
        }

        // UI 辅助函数
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            if (statusDiv) {
                statusDiv.textContent = message;
                statusDiv.className = type === 'success' ? 'status-success' : 'status-error';
                setTimeout(() => {
                    statusDiv.textContent = '';
                    statusDiv.className = '';
                }, 5000);
            }
        }

        function showLoading(message = 'Loading...') {
            isLoading = true;
            const overlay = document.getElementById('loading-overlay');
            const loadingText = overlay.querySelector('.loading-text');
            if (loadingText) loadingText.textContent = message;
            overlay.style.display = 'flex';
            document.body.classList.add('loading');
            disableControls(true);
        }

        function hideLoading() {
            isLoading = false;
            document.getElementById('loading-overlay').style.display = 'none';
            document.body.classList.remove('loading');
            disableControls(false);
        }

        function disableControls(disabled) {
            const selector = 'button, input';
            document.querySelectorAll(selector).forEach(el => el.disabled = disabled);
        }
    </script>
</body>
</html>
