<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Smart Weather clock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* 全局样式重置 */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* 基础样式 */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f5f5f5;
            padding: 20px;
            color: #333;
        }

        h1 { text-align: center; margin-bottom: 30px; font-size: 2.5rem; color: #333; }
        h2 { margin: 25px 0 15px; font-size: 1.5rem; color: #444; border-bottom: 2px solid #4CAF50; padding-bottom: 8px; }

        /* 加载遮罩层样式 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px; height: 50px;
            border: 5px solid #f3f3f3; border-top: 5px solid #4CAF50;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        .loading-text { color: white; font-size: 1.2rem; font-weight: bold; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 禁用状态样式 */
        button:disabled, input:disabled { opacity: 0.6; cursor: not-allowed !important; }
        body.loading { cursor: wait; }

        /* 输入控件通用样式 */
        input[type="text"], input[type="range"], select {
            width: 100%; padding: 12px; border: 2px solid #ddd;
            border-radius: 8px; font-size: 1.1rem; margin-bottom: 15px;
        }

        /* 滑块样式 */
        input[type="range"] { -webkit-appearance: none; height: 8px; background: #ddd; border-radius: 5px; padding: 0; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #4CAF50; border-radius: 50%; cursor: pointer; }

        input[type="checkbox"] { width: 15px; height: 15px; margin-right: 4px; cursor: pointer; }
        input[type="file"] { margin: 2px 0; padding: 0px; border: 2px solid #ddd; border-radius: 3px; background: white; }

        /* 图片缩略图样式 */
        .thumbnail-container {
            display: flex; flex-direction: column; align-items: flex-start;
            gap: 4px; margin: 4px 0; padding: 8px;
            border: 1px solid #ddd; border-radius: 8px; background: white;
        }

        .thumbnail-container img { margin: 0; border: 1px solid #ccc; border-radius: 2px; object-fit: cover; }

        /* 按钮样式 */
        button {
            background-color: #4CAF50; color: white; padding: 12px 20px;
            border: none; border-radius: 8px; cursor: pointer;
            font-size: 1.1rem; font-weight: bold; margin: 5px 0;
            transition: background-color 0.3s; width: 100%;
        }
        button:hover { background-color: #45a049; }

        /* 状态显示 */
        #status { padding: 10px; margin: 10px 0; border-radius: 5px; text-align: center; font-weight: bold; min-height: 40px;}
        .status-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            h2 { font-size: 1.3rem; }
        }
    </style>
</head>

</dialog>

<script>
/* Remove encoder metadata from the known sRGB Canvas JPEG, keeping pixel data.
 * The device still validates baseline 240x240 dimensions, complete scans and EOI. */
async function stripCanvasJpegMetadata(blob) {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    if (bytes.length < 4 || bytes[0] !== 255 || bytes[1] !== 0xd8 ||
        bytes[bytes.length - 2] !== 255 || bytes[bytes.length - 1] !== 0xd9) {
        throw new Error('Canvas did not produce a complete JPEG');
    }
    const parts = [bytes.subarray(0, 2)];
    let position = 2;
    while (position + 4 <= bytes.length) {
        if (bytes[position] !== 255 || bytes[position + 1] === 255) {
            throw new Error('Invalid Canvas JPEG marker');
        }
        const marker = bytes[position + 1];
        const length = (bytes[position + 2] << 8) | bytes[position + 3];
        const end = position + 2 + length;
        if (length < 2 || end > bytes.length) {
            throw new Error('Truncated Canvas JPEG header');
        }
        if (marker === 0xda) {
            // Entropy bytes include FF00 escapes: never search/edit them as
            // header segments. Copy the complete encoded scan and EOI intact.
            parts.push(bytes.subarray(position));
            return new Blob(parts, {type: 'image/jpeg'});
        }
        // Canvas pixels already use sRGB. APP/COM can reveal EXIF, profiles,
        // software or thumbnails; no such segment is needed by the LCD decoder.
        if (!(marker >= 0xe0 && marker <= 0xef) && marker !== 0xfe) {
            parts.push(bytes.subarray(position, end));
        }
        position = end;
    }
    throw new Error('Canvas JPEG has no image scan');
}

        // 全局变量
        let currentSettings = {
            display_time: 5,
            file_states: {}
        };
        let isLoading = false;

        document.addEventListener('DOMContentLoaded', function() {
            initializePage();
        });

        // 初始化页面
        async function initializePage() {
            try {
                await loadDisplayTime();
                await loadCheckboxStates();
                await refreshAllThumbnails();
                setupEventListeners();
            } catch (error) {
                console.error('Error initializing page:', error);
                showStatus('Initialization failed: ' + error.message, 'error');
            }
        }

        function updateLoadingText(message) {
            const loadingText = document.querySelector('.loading-text');
            if (loadingText && isLoading) {
                loadingText.textContent = message;
            }
        }

        // 加载显示时间
        async function loadDisplayTime() {
            try {
                const response = await fetch('/get_display_time');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                const displayTime = data.displaytime || 5;

                const slider = document.getElementById('displaytime');
                const valueDisplay = document.getElementById('display-time-value');
                if (slider) { slider.value = displayTime; currentSettings.display_time = displayTime; }
                if (valueDisplay) { valueDisplay.textContent = displayTime + 's'; }
            } catch (error) {
                console.warn('Could not load display time, utilizing defaults');
            }
        }

        // 加载复选框状态
        async function loadCheckboxStates() {
            try {
                const response = await fetch('/get_checkbox_state');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                for (let i = 1; i <= 5; i++) {
                    const checkbox = document.getElementById(`file${i}-switch`);
                    if (checkbox) {
                        const state = data[`file${i}_switch`];
                        checkbox.checked = state !== undefined ? state : true;
                    }
                }
            } catch (error) {
                console.warn('Could not load checkbox states');
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 滑块
            const displayTimeSlider = document.getElementById('displaytime');
            if (displayTimeSlider) {
                displayTimeSlider.addEventListener('input', function() {
                    document.getElementById('display-time-value').textContent = this.value + 's';
                });
                displayTimeSlider.addEventListener('change', function() {
                    updateDisplayTime(this.value);
                });
            }

            // 复选框
            document.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
                checkbox.addEventListener('change', function() {
                    updateCheckboxState(this.id, this.checked);
                });
            });

            // 文件上传 (关键修改：监听 change 事件)
            for (let i = 1; i <= 5; i++) {
                const fileInput = document.getElementById(`imageFile${i}`);
                if (fileInput) {
                    fileInput.addEventListener('change', function() {
                        handleFileUpload(this, i);
                    });
                }
            }

            // 返回按钮
            const returnButton = document.getElementById('return-btn');
            if (returnButton) {
                returnButton.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href='/';
                });
            }
        }

        async function updateDisplayTime(time) {
            try {
                await fetch('/set_display_time', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },

                    body: JSON.stringify({ checkbox_id: checkboxId, checked: checked })

        }

/* Compute a square entirely inside the decoded image, using slider positions.
 * Percentages cover the available travel after zoom, including both edges. */
function squareCropBounds(width, height, zoom, horizontal, vertical) {
    if (![width, height, zoom, horizontal, vertical].every(Number.isFinite) ||
        width <= 0 || height <= 0 || zoom < 1 || zoom > 4 ||
        horizontal < 0 || horizontal > 100 || vertical < 0 || vertical > 100) {
        throw new Error('Invalid image crop');
    }
    const size = Math.min(width, height) / zoom;
    return {x: (width - size) * horizontal / 100,
        y: (height - size) * vertical / 100, size};
}

/* Resize about the opposite corner, keeping the LCD's square proportions.
 * Project pointer movement onto the corner diagonal and clamp to the image
 * edges and 1..4× zoom limits; crossing the anchor never flips the frame. */
function resizeSquareCrop(crop, width, height, corner, dx, dy) {
    if (!['nw','ne','sw','se'].includes(corner) ||
        ![width,height,crop.x,crop.y,crop.size,dx,dy].every(Number.isFinite) ||
        width <= 0 || height <= 0 || crop.size <= 0 || crop.x < 0 || crop.y < 0 ||
        crop.x + crop.size > width || crop.y + crop.size > height) {
        throw new Error('Invalid crop resize');
    }
    const sx = corner.endsWith('e') ? 1 : -1;
    const sy = corner.startsWith('s') ? 1 : -1;
    const anchorX = sx > 0 ? crop.x : crop.x + crop.size;
    const anchorY = sy > 0 ? crop.y : crop.y + crop.size;
    const maximum = Math.min(sx > 0 ? width - anchorX : anchorX,
        sy > 0 ? height - anchorY : anchorY, Math.min(width,height));
    const minimum = Math.min(width,height) / 4;
    const size = Math.max(minimum, Math.min(maximum, crop.size + (sx*dx + sy*dy)/2));
    return {x: sx > 0 ? anchorX : anchorX - size,
        y: sy > 0 ? anchorY : anchorY - size, size};
}

/* Let the user move/zoom a square before any upload request is sent.
 * The full image is drawn with letterboxing; the selected source coordinates
 * are independent of CSS size, so dragging also works on a phone. */
function choosePhotoCrop(image) {
    return new Promise((resolve, reject) => {
        const dialog = document.getElementById('crop-dialog');
        const preview = document.getElementById('crop-preview');
        const context = preview.getContext('2d');
        const zoom = document.getElementById('crop-zoom');
        const horizontal = document.getElementById('crop-horizontal');
        const vertical = document.getElementById('crop-vertical');
        const confirm = document.getElementById('crop-confirm');
        const cancel = document.getElementById('crop-cancel');
        const width = image.naturalWidth, height = image.naturalHeight;
        const scale = Math.min(preview.width / width, preview.height / height);
        const offsetX = (preview.width - width * scale) / 2;
        const offsetY = (preview.height - height * scale) / 2;
        const listeners = [];
        let drag = null;
        zoom.value = '1'; horizontal.value = '50'; vertical.value = '50';
        let selected = squareCropBounds(width, height, 1, 50, 50);

        function bounds() {
            return selected;
        }
        function selectFromControls() {
            selected = squareCropBounds(width, height, Number(zoom.value),
                Number(horizontal.value), Number(vertical.value));
            redraw();
        }
        // Darken only the unselected pixels, leaving the source image visible.
        function redraw() {
            const crop = bounds();
            const x = offsetX + crop.x * scale, y = offsetY + crop.y * scale;
            const size = crop.size * scale;
            context.clearRect(0, 0, preview.width, preview.height);
            context.fillStyle = '#fff';
            context.fillRect(offsetX, offsetY, width * scale, height * scale);
            context.drawImage(image, offsetX, offsetY, width * scale, height * scale);
            context.fillStyle = 'rgba(0,0,0,.6)';
            context.fillRect(0, 0, preview.width, y);
            context.fillRect(0, y + size, preview.width, preview.height - y - size);
            context.fillRect(0, y, x, size);
            context.fillRect(x + size, y, preview.width - x - size, size);
            context.lineWidth = 2; context.strokeStyle = '#fff';
            context.strokeRect(x, y, size, size);
            // Visible corner handles keep a usable size at narrow CSS widths.
            const handle = 12 * preview.width / preview.getBoundingClientRect().width;
            context.fillStyle = '#fff';
            for (const hx of [x,x+size]) for (const hy of [y,y+size]) {
                context.fillRect(hx-handle/2,hy-handle/2,handle,handle);
            }
            horizontal.disabled = width === crop.size;
            vertical.disabled = height === crop.size;
        }
        function listen(target, event, handler) {
            target.addEventListener(event, handler);
            listeners.push(() => target.removeEventListener(event, handler));
        }
        // Remove every handler on confirm/cancel so repeated uploads do not
        // retain earlier images or invoke multiple upload promises.
        function finish(accepted) {
            const crop = accepted ? bounds() : null;
            listeners.forEach(remove => remove());
            if (drag && preview.hasPointerCapture(drag.id)) preview.releasePointerCapture(drag.id);
            drag = null;
            dialog.close();
            if (accepted) resolve(crop);
            else reject(new DOMException('Upload cancelled', 'AbortError'));
        }
        listen(zoom, 'input', selectFromControls);
        listen(horizontal, 'input', selectFromControls);
        listen(vertical, 'input', selectFromControls);
        listen(confirm, 'click', () => finish(true));
        listen(cancel, 'click', () => finish(false));
        listen(dialog, 'cancel', event => { event.preventDefault(); finish(false); });
        listen(preview, 'pointerdown', event => {
            if (drag) return;
            const crop = bounds();
            const rectangle = preview.getBoundingClientRect();
            const px = (event.clientX-rectangle.left)*preview.width/rectangle.width;
            const py = (event.clientY-rectangle.top)*preview.height/rectangle.height;
            const radius = 14 * preview.width / rectangle.width;
            let corner = null;
            for (const [name,cx,cy] of [['nw',crop.x,crop.y],['ne',crop.x+crop.size,crop.y],
                ['sw',crop.x,crop.y+crop.size],['se',crop.x+crop.size,crop.y+crop.size]]) {
                if (Math.hypot(px-offsetX-cx*scale,py-offsetY-cy*scale) <= radius) {
                    corner = name; break;
                }
            }
            drag = {id:event.pointerId, x:event.clientX, y:event.clientY, crop, corner};
            preview.style.cursor = corner ? (corner==='nw' || corner==='se' ?
                'nwse-resize' : 'nesw-resize') : 'move';
            preview.setPointerCapture(event.pointerId);
        });
        listen(preview, 'pointermove', event => {
            if (!drag || drag.id !== event.pointerId) return;
            const rectangle = preview.getBoundingClientRect();
            const dx = (event.clientX - drag.x) * preview.width / rectangle.width / scale;
            const dy = (event.clientY - drag.y) * preview.height / rectangle.height / scale;
            if (drag.corner) selected = resizeSquareCrop(drag.crop,width,height,drag.corner,dx,dy);
            else selected = {x:Math.max(0,Math.min(width-drag.crop.size,drag.crop.x+dx)),
                y:Math.max(0,Math.min(height-drag.crop.size,drag.crop.y+dy)),size:drag.crop.size};
            // Keep exact source coordinates for export; range values are only
            // a rounded display until the user actually moves a slider.
            zoom.value = String(Math.min(width,height) / selected.size);
            horizontal.value = String(width===selected.size ? 50 : selected.x*100/(width-selected.size));
            vertical.value = String(height===selected.size ? 50 : selected.y*100/(height-selected.size));
            redraw();
        });
        function endDrag(event) {
            if (drag && drag.id === event.pointerId) {
                if (preview.hasPointerCapture(drag.id)) preview.releasePointerCapture(drag.id);
                drag = null;
                preview.style.cursor = 'move';
            }
        }
        listen(preview, 'pointerup', endDrag);
        listen(preview, 'pointercancel', endDrag);
        hideLoading();
        dialog.showModal();
        redraw();
    });
}

/* Decode locally, ask which square to keep, and resample it to LCD dimensions.
 * Canvas produces fresh JPEG pixels; stripCanvasJpegMetadata removes the
 * encoder's APP/COM segments before the existing chunk upload begins. */
async function resizeAndCropImage(file) {
    if (!file.type.startsWith('image/')) throw new Error('File is not an image');
    const image = new Image();
    const url = URL.createObjectURL(file);
    try {
        await new Promise((resolve, reject) => {
            image.onload = resolve;
            image.onerror = () => reject(new Error('Failed to load image'));
            image.src = url;
        });
        const crop = await choosePhotoCrop(image);
        showLoading('Processing selected area…');
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 240;
        const context = canvas.getContext('2d');
        // JPEG has no alpha channel; transparent input gets a white background.
        context.fillStyle = '#fff'; context.fillRect(0, 0, 240, 240);
        context.drawImage(image, crop.x, crop.y, crop.size, crop.size, 0, 0, 240, 240);
        const encode = quality => new Promise((resolve, reject) => {
            canvas.toBlob(blob => blob ? resolve(blob) :
                reject(new Error('Canvas JPEG encoding failed')), 'image/jpeg', quality);
        });
        let blob = await encode(0.9);
        if (blob.size > 100 * 1024) blob = await encode(0.6);
        if (blob.size > 100 * 1024) throw new Error('Image exceeds the 100KB slot');
        return blob;
    } finally {
        URL.revokeObjectURL(url);
    }
}


        async function handleFileUpload(fileInput, fileNumber) {
            const rawFile = fileInput.files[0];
            if (!rawFile) return;

            // 清空input，以便可以重复上传同一张图片
            fileInput.value = '';

            try {
                showLoading(`Processing image ${fileNumber}...`);

                // 1. 调用预处理函数
                const processedBlob = await resizeAndCropImage(rawFile);

                // 2. 将 Blob 转为 File 对象以便上传函数使用
                const cleanBlob = await stripCanvasJpegMetadata(processedBlob);
                const processedFile = new File([cleanBlob], `file${fileNumber}.jpg`, { type: 'image/jpeg' });

                console.log(`Original: ${rawFile.size}B, Processed: ${processedFile.size}B`);

                updateLoadingText(`Uploading file ${fileNumber}...`);

                // 3. 执行分块上传
                await uploadImageInChunks(processedFile, fileNumber);

                // 4. 上传成功后，直接用处理后的图片更新预览图 (无需从服务器重新下载，体验更快)
                const url = URL.createObjectURL(cleanBlob);
                const thumb = document.getElementById(`thumbnail${fileNumber}`);
                if(thumb) {
                    thumb.src = url;
                    thumb.style.display = 'block';
                }

                showStatus(`File ${fileNumber} uploaded successfully`, 'success');

                // 确保开关打开
                const checkbox = document.getElementById(`file${fileNumber}-switch`);
                if (checkbox && !checkbox.checked) {
                    checkbox.checked = true;
                    updateCheckboxState(checkbox.id, true);
                }

            } catch (error) {
                if (error.name !== 'AbortError') console.error('Upload process error:', error);
                showStatus(error.name === 'AbortError' ? 'Upload cancelled' : `Error: ${error.message}`,
                    error.name === 'AbortError' ? 'info' : 'error');
            } finally {
                hideLoading();
            }
        }

async function uploadImageInChunks(file, fileNumber) {
    /* Upload ordered blocks, retry lost replies and publish only after all ACKs.
     * REQUESTED_CHANGE: remove software waits after successful synchronous flash
     * writes and after the final failed attempt. Keep backoff between retries. */
    const chunkSize = 4096;
    const maxAttempts = 5;
    const totalChunks = Math.ceil(file.size / chunkSize);
    const startResponse = await fetch('/start_upload', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({file_number: fileNumber, file_size: file.size,
            total_chunks: totalChunks})
    });
    if (!startResponse.ok) throw new Error('Failed to start upload session');

    for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
        const start = chunkIndex * chunkSize;
        const formData = new FormData();
        formData.append('chunk', file.slice(start, Math.min(start + chunkSize, file.size)));
        formData.append('file_number', fileNumber.toString());
        formData.append('chunk_index', chunkIndex.toString());
        formData.append('total_chunks', totalChunks.toString());
        let lastError;
        let success = false;
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
            try {
                const progress = Math.round((chunkIndex / totalChunks) * 100);
                updateLoadingText(`Uploading... ${progress}% (File ${fileNumber})`);
                const response = await fetch('/upload_chunk', {method: 'POST', body: formData});
                if (response.ok) {
                    success = true;
                    break;
                }
                lastError = `HTTP ${response.status}`;
            } catch (error) {
                lastError = error.message;
            }
            // A lost reply may follow a completed write. Reuse the same block,
            // and wait only when another attempt will actually be made.
            if (attempt + 1 < maxAttempts) {
                await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
            }
        }
        if (!success) throw new Error(`Chunk ${chunkIndex} failed after retries: ${lastError}`);
        // The native server ACK follows esp_partition_write. Awaiting that ACK
        // paces writes without the factory page's additional 50 ms per block.
    }

    const finishResponse = await fetch('/finish_upload', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({file_number: fileNumber, file_name: `file${fileNumber}.jpg`})
    });
    if (!finishResponse.ok) throw new Error('Finish upload command failed');
}


        // 分块下载图片 (用于页面加载时获取预览图)
        async function downloadImageInChunks(fileNumber, fileSize) {
            const CHUNK_SIZE = 10240; // 下载时可以用大一点的块
            const totalChunks = Math.ceil(fileSize / CHUNK_SIZE);
            const chunks = [];

			console.log(`Starting download: file${fileNumber}, size: ${fileSize}, chunks: ${totalChunks}`);

            for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
                const response = await fetch(`/get_Photo_File?file=${fileNumber}&chunk=${chunkIndex}&size=${CHUNK_SIZE}`);
                if (!response.ok) throw new Error(`Download chunk ${chunkIndex} failed`);

                const chunkData = await response.arrayBuffer();
                chunks.push(new Uint8Array(chunkData));

                // 避免UI卡顿
                if(chunkIndex % 5 === 0) await new Promise(r => setTimeout(r, 10));
            }

            const totalLength = chunks.reduce((acc, chunk) => acc + chunk.length, 0);
            const result = new Uint8Array(totalLength);
            let offset = 0;
            for (const chunk of chunks) {
                result.set(chunk, offset);
                offset += chunk.length;
            }
            return result;
        }

        // 刷新单个缩略图
        async function refreshThumbnail(fileNumber) {
            try {
                const thumbnail = document.getElementById(`thumbnail${fileNumber}`);
                if (!thumbnail) return;

                // 获取图片信息
                const infoResponse = await fetch(`/get_Photo_File?file=${fileNumber}&chunk=0&size=0`);
                if (!infoResponse.ok) return; // 忽略错误，可能文件不存在

                const imageInfo = await infoResponse.json();
                if (!imageInfo.exists || imageInfo.size === 0) {
                    thumbnail.style.display = 'none';
                    return;
                }

                const imageData = await downloadImageInChunks(fileNumber, imageInfo.size);
                const blob = new Blob([imageData], { type: 'image/jpeg' });
                const url = URL.createObjectURL(blob);

                thumbnail.src = url;
                thumbnail.style.display = 'block';

            } catch (error) {
                console.log(`Thumbnail ${fileNumber} load skipped or failed`);
            }
        }

        // 刷新所有缩略图
        async function refreshAllThumbnails() {
            try {
                showLoading('Loading previews...');
                for (let i = 1; i <= 5; i++) {
                    updateLoadingText(`Loading preview ${i}/5`);
                    await refreshThumbnail(i);
                }
            } catch(e) {
                console.error(e);
            } finally {
                hideLoading();
            }
        }

        // UI 辅助函数
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            if (statusDiv) {
                statusDiv.textContent = message;
                statusDiv.className = type === 'success' ? 'status-success' : type === 'error' ? 'status-error' : '';
                setTimeout(() => {
                    statusDiv.textContent = '';
                    statusDiv.className = '';
                }, 5000);
            }
        }

        function showLoading(message = 'Loading...') {
            isLoading = true;
            const overlay = document.getElementById('loading-overlay');
            const loadingText = overlay.querySelector('.loading-text');
            if (loadingText) loadingText.textContent = message;
            overlay.style.display = 'flex';
            document.body.classList.add('loading');
            disableControls(true);
        }

        function hideLoading() {
            isLoading = false;
            document.getElementById('loading-overlay').style.display = 'none';
            document.body.classList.remove('loading');
            disableControls(false);
        }

        function disableControls(disabled) {
            const selector = 'button, input';
            document.querySelectorAll(selector).forEach(el => el.disabled = disabled);
        }
    </script>
