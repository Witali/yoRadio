<style>
    #crop-dialog { margin: auto; width: min(520px, 95vw); max-height: 95vh;
        overflow: auto; padding: 20px; border: 0; border-radius: 12px; }
    #crop-dialog::backdrop { background: rgba(0, 0, 0, .7); }
    #crop-dialog h2 { margin-top: 0; }
    #crop-preview { display: block; width: 100%; height: auto; background: #222;
        touch-action: none; cursor: move; margin: 12px 0; }
    #crop-dialog label { display: block; margin: 12px 0 8px; }
    #crop-dialog input { margin-bottom: 8px; }
    #crop-cancel { background: #555; }
</style>
<dialog id="crop-dialog" aria-labelledby="crop-title" aria-describedby="crop-help">
    <h2 id="crop-title">Choose the area to keep</h2>
    <p id="crop-help">Drag inside the square to move it; drag a corner to resize it. You can also use the sliders. The selected area will be saved as a 240 × 240 JPEG without metadata.</p>
    <canvas id="crop-preview" width="480" height="360" aria-label="Photo with selected square"></canvas>
    <label for="crop-zoom">Zoom</label>
    <input id="crop-zoom" type="range" min="1" max="4" step="0.05" value="1">
    <label for="crop-horizontal">Horizontal position</label>
    <input id="crop-horizontal" type="range" min="0" max="100" step="1" value="50">
    <label for="crop-vertical">Vertical position</label>
    <input id="crop-vertical" type="range" min="0" max="100" step="1" value="50">
    <button id="crop-confirm" type="button">Use selected area and upload</button>
    <button id="crop-cancel" type="button">Cancel</button>
</dialog>
